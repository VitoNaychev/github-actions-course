name: Docker
on: [workflow_dispatch]

jobs:
  docker-job:
    runs-on: ubuntu-latest
    container: 
      image: golang:1.23.1-bookworm
      # credentials:
      #   username: "hello"
      #   password: "world"
      env:
        API_URL: some-url.com
      ports:
        - 80
      # volumes:
      #   - vol_name;/path/in/container
      #   - /path/to/container
      #   - /path/in/host:/path/in/container
      # options: --cpus 1
    steps:
      - name: Log Go & OS Versions
        run: |
          go version
          cat /etc/os-release
      - name: Log Env
        run: echo "$API_URL"
      - name: Create File
        run: echo 'Some text' > text.txt
      - name: Container in a step
        uses: docker://golang:1.22.7-bullseye
        with: 
          entrypoint: cat
          args: text.txt
      - name: Send a slack message
        uses: docker://technosophos/slack-notify/
        env:
            SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
            SLACK_TITLE: From Github Actions
            SLACK_MESSAGE: "Actor ${{ github.actor }}, Event: ${{ github.event_name }}"
            SLACK_COLOR: "#723fc4"